services:
  postgres:
    image: postgres:15-alpine
    container_name: cerberus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybersaarthi
      POSTGRES_USER: cybersaarthi
      POSTGRES_PASSWORD: cybersaarthi_secure_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersaarthi -d cybersaarthi"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.16.0-community
    container_name: cerberus-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/cybersaarthi_graph_pass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p cybersaarthi_graph_pass 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cerberus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cybersaarthi:cybersaarthi_secure_pass@postgres:5432/cybersaarthi
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cybersaarthi_graph_pass
      SECRET_KEY: cybersaarthi_production_jwt_secret_key_2026
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: cerberus-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  neo4j_data: